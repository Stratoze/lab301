# Override main config for ALL tests — use H2 in-memory, no Docker needed
spring.config.import=
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Disable mail (no SMTP in tests)
spring.mail.host=localhost
spring.mail.port=25

# JWT (dummy values for context load)
jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-hmac
jwt.expiration=86400000

# Social (empty = won't be called in unit tests)
google.client-id=test
facebook.app-id=test
facebook.app-secret=test

# App
app.frontend-base-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173